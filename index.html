<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>16년생 홍우주의 기쁨</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:white;font-family:system-ui;touch-action:none}button,input{font:inherit}button{background:#191919;color:white;border:1px solid #888;border-radius:10px;padding:12px 16px;font-weight:700}#menu,#lobby,#end,#scare,#landscape{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;background:radial-gradient(ellipse,#25251b,#050505 70%)}#lobby,#end,#scare,#landscape{display:none;background:#050505eF}h1{color:#ffe34d;font-size:clamp(28px,6vw,58px);margin:0}h2{color:#f33;margin:0;font-size:clamp(26px,5vw,45px)}p{color:#ccc;line-height:1.5}.buttons{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}input{width:150px;background:#111;color:white;border:1px solid #777;padding:12px;border-radius:8px}#game{display:none;position:absolute;inset:0}canvas{width:100%;height:100%;display:block}#hud{position:absolute;inset:0;padding:12px;pointer-events:none;text-shadow:0 2px 5px black}#objective{background:#000a;border:1px solid #7778;border-radius:8px;padding:8px;display:inline-block}#exit{float:right;pointer-events:auto;padding:7px}#notice{position:absolute;top:17%;left:5%;width:90%;text-align:center;font-size:clamp(17px,3vw,28px);font-weight:800}#hint{display:none;position:absolute;bottom:18%;left:50%;transform:translateX(-50%);background:#000c;padding:10px;border:1px solid #aaa;border-radius:9px;white-space:nowrap}#mobile{display:none;position:absolute;inset:0;pointer-events:none}.stick{position:absolute;bottom:20px;left:18px;width:130px;height:130px;border:2px solid #ffffff66;border-radius:50%;background:#ffffff18;pointer-events:auto}.stick:after{content:'';position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:#ffffff88}.actions{position:absolute;right:14px;bottom:22px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.actions button{min-width:90px;background:#111d}#scare .eyes{font-size:clamp(100px,25vw,240px);color:red;text-shadow:0 0 35px red}#end h2{color:#ffe34d}@media(max-width:800px){#mobile{display:block}}@media(orientation:portrait) and (max-width:900px){body.playing #landscape{display:flex}body.playing #game canvas,body.playing #hud,body.playing #mobile{visibility:hidden}}
</style></head><body>
<div id="menu"><h1 id="title">16년생 홍우주의 기쁨</h1><p id="tag">신나는 음악이 흐르는 미로에 어서 와!</p><button id="question" style="font-size:25px;min-width:120px">?</button><small>모바일은 가로 화면 권장 · PC 키보드/마우스</small></div>
<div id="lobby"><h2>16년생 홍우주의 분노</h2><p>미로에서 살아서 탈출해.</p><div class="buttons"><button id="single">싱글 플레이</button><button id="multi">멀티 플레이</button></div><div id="multiPanel" style="display:none"><p>방 번호</p><div class="buttons"><button id="create">방 생성</button><input id="room" placeholder="방 번호" maxlength="6"><button id="join">참가</button></div><p id="roomMsg">실제 온라인 멀티에는 서버 연결이 필요합니다.</p></div><button id="back">뒤로</button></div>
<div id="game"><canvas id="view"></canvas><div id="hud"><span id="objective">열쇠 0/1 · 비밀번호 0/4</span><button id="exit">나가기</button><div id="notice"></div><div id="hint"></div></div><div id="mobile"><div id="stick" class="stick"></div><div class="actions"><button id="flash">🔦 손전등</button><button id="use">열기 / 숨기</button></div></div></div>
<div id="landscape"><div style="font-size:48px">↻</div><h2>화면을 가로로 돌려 줘</h2><p>가로 화면에서 미로를 탐험할 수 있어.</p></div>
<div id="scare"><div class="eyes">◉ ◉</div><h2>잡혔다!</h2><button id="retry">다시 시작</button></div><div id="end"><h2 id="endTitle">탈출 성공!</h2><p id="endMsg"></p><button id="again">다시 플레이</button><button id="toMenu">메인 메뉴</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=x=>document.getElementById(x);let scene,camera,renderer,clock,flash,monster,maze=[],N=25,player,doors=[],hides=[],digits=[],exitObj,gotKey=false,found=[false,false,false,false],hidden=false,hideObj=null,flashOn=true,active=false,dead=false,yaw=0,keys={},joy={x:0,y:0},joyId=null,audioCtx,timer,mode='single',roomCode='';
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1}),wall=mat(0x303030),floorM=mat(0x1b1b1b),wood=mat(0x49301f),dark=mat(0x030303),metal=mat(0x888888),red=mat(0x761111);
function sound(){if(!audioCtx){let A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx?.state==='suspended')audioCtx.resume()}
function tone(f,d=.2,type='sine',v=.04,slide=0){if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),audioCtx.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function music(evil){clearInterval(timer);let i=0;timer=setInterval(()=>{sound();let a=evil?[65,70,55,90,58,80]:[523,659,784,659,587,698,880];tone(a[i++%a.length],evil?.4:.16,evil?'sawtooth':'square',evil?.035:.025,evil?-12:0)},evil?430:190)}
function sfx(t){sound();if(t==='scare'){tone(55,.8,'sawtooth',.25,800);setTimeout(()=>tone(80,.7,'square',.2,500),100)}else if(t==='key'){tone(900,.12,'sine',.07);setTimeout(()=>tone(1300,.18,'sine',.06),100)}else{tone(250,.12,'triangle',.06);setTimeout(()=>tone(520,.12,'triangle',.05),100)}}
function box(x,y,z,sx,sy,sz,m){let o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function openMaze(){maze=Array.from({length:N},()=>Array(N).fill(1));let st=[[1,1]];maze[1][1]=0;while(st.length){let [x,y]=st.at(-1),a=[];for(let [dx,dy] of [[2,0],[-2,0],[0,2],[0,-2]]){let X=x+dx,Y=y+dy;if(X>0&&Y>0&&X<N-1&&Y<N-1&&maze[Y][X])a.push([X,Y,dx,dy])}if(!a.length){st.pop();continue}let [X,Y,dx,dy]=a[Math.floor(Math.random()*a.length)];maze[y+dy/2][x+dx/2]=0;maze[Y][X]=0;st.push([X,Y])}for(let i=0;i<30;i++){let x=1+Math.random()*(N-2)|0,y=1+Math.random()*(N-2)|0;if(maze[y][x]&&((!maze[y][x-1]&&!maze[y][x+1])||(!maze[y-1]?.[x]&&!maze[y+1]?.[x])))maze[y][x]=0}}
function cells(){let a=[];for(let z=1;z<N-1;z++)for(let x=1;x<N-1;x++)if(!maze[z][x]&&Math.abs(x-1)+Math.abs(z-1)>7)a.push({x:x+.5,z:z+.5});return a}
function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function obj(p,type,extra={}){let g=new THREE.Group();g.position.set(p.x,0,p.z);scene.add(g);if(type==='wardrobe'){boxLocal(g,0,1,0,.9,2,.65,wood);boxLocal(g,-.22,1,.34,.42,1.84,.04,mat(0x593a27));boxLocal(g,.22,1,.34,.42,1.84,.04,mat(0x593a27))}if(type==='bed'){boxLocal(g,0,.3,0,1.1,.35,.7,wood);boxLocal(g,0,.52,0,1.08,.15,.68,mat(0x66605a));boxLocal(g,-.3,.64,0,.3,.1,.45,mat(0xddd8cf))}if(type==='drawer'){boxLocal(g,0,.4,0,.75,.8,.55,wood);boxLocal(g,0,.25,.29,.64,.18,.03,mat(0x69472d));boxLocal(g,0,.53,.29,.64,.18,.03,mat(0x69472d))}if(type==='exit'){boxLocal(g,0,1.25,0,1.35,2.5,.18,metal);boxLocal(g,0,1.25,.12,1.08,2.25,.05,red)}if(type==='key'){let r=new THREE.Mesh(new THREE.TorusGeometry(.13,.035,8,18),mat(0xffd52a));r.position.y=.65;g.add(r);boxLocal(g,.12,.42,0,.06,.4,.06,mat(0xffd52a))}if(type==='digit'){let c=document.createElement('canvas');c.width=c.height=128;let q=c.getContext('2d');q.fillStyle='#222';q.fillRect(0,0,128,128);q.fillStyle='#ffdf50';q.font='bold 80px monospace';q.textAlign='center';q.textBaseline='middle';q.fillText(extra.digit,64,65);let m=new THREE.Mesh(new THREE.PlaneGeometry(.48,.48),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.DoubleSide}));m.position.set(0,1.4,0);g.add(m)}return g}
function boxLocal(g,x,y,z,sx,sy,sz,m){let o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;g.add(o)}
function build(){scene=new THREE.Scene();scene.background=new THREE.Color(0x030303);scene.fog=new THREE.Fog(0x030303,3,22);camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.08,80);camera.rotation.order='YXZ';renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;scene.add(new THREE.HemisphereLight(0x777788,0x16100b,.5));scene.add(new THREE.AmbientLight(0x333333,.35));flash=new THREE.SpotLight(0xffefcf,60,17,Math.PI/7,.55,1.4);camera.add(flash);flash.target.position.set(0,0,-1);camera.add(flash.target);scene.add(camera);box(N/2,-.12,N/2,N,.24,N,floorM);box(N/2,3.05,N/2,N,.18,N,mat(0x111111));for(let z=0;z<N;z++)for(let x=0;x<N;x++)if(maze[z][x])box(x+.5,1.5,z+.5,1,3,1,wall);
 player={x:1.5,z:1.5};yaw=0;camera.position.set(player.x,1.62,player.z);camera.rotation.set(0,0,0);let a=cells(),far=a.filter(p=>dist(p,player)>13),ep=far.splice(Math.random()*far.length|0,1)[0]||{x:N-2.5,z:N-2.5};exitObj={pos:ep,obj:obj(ep,'exit')};let mp=far.filter(p=>dist(p,player)>10),m=mp[Math.random()*mp.length|0]||{x:N-2.5,z:N-2.5};monster=new THREE.Group();monster.position.set(m.x,0,m.z);scene.add(monster);boxLocal(monster,0,1.15,0,.48,1.2,.35,dark);let head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,12),dark);head.position.y=1.95;monster.add(head);for(let x of [-.13,.13]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),mat(0xff0000));eye.position.set(x,2,-.22);monster.add(eye)}for(let x of [-.16,.16]){boxLocal(monster,x,.35,0,.14,.7,.16,dark);boxLocal(monster,x*2,1.2,0,.12,.8,.12,dark)}
 let kp=a.splice(Math.random()*a.length|0,1)[0]||{x:N-3.5,z:N-2.5};obj(kp,'key');gotKey=false;doors=[];let ds=a.splice(0,8),ki=Math.random()*Math.max(1,ds.length)|0;ds.forEach((p,i)=>doors.push({pos:p,obj:obj(p,'drawer'),opened:false,key:i===ki}));digits=[];let code=String(1000+(Math.random()*9000|0));for(let i=0;i<4;i++){let p=a.splice(Math.random()*Math.max(1,a.length)|0,1)[0]||{x:3.5+i*2,z:3.5};digits.push({pos:p,obj:obj(p,'digit',{digit:code[i]}),found:false})}hides=[];a.splice(0,Math.min(14,a.length)).forEach((p,i)=>hides.push({pos:p,obj:obj(p,i%2?'bed':'wardrobe'),type:i%2?'bed':'wardrobe'}));hides=hides.filter(h=>dist(h.pos,player)>2.5);doors=doors.filter(d=>dist(d.pos,player)>2.5);let l=new THREE.PointLight(0xffdf8a,3,5);l.position.set(1.5,2,1.5);scene.add(l);clock=new THREE.Clock()}
let clock;
function wallAt(x,z){return !maze[Math.floor(z)]||maze[Math.floor(z)][Math.floor(x)]!==0}
function blocked(x,z){let r=.22;return [[x-r,z-r],[x+r,z-r],[x-r,z+r],[x+r,z+r]].some(p=>wallAt(...p))}
function near(p,r=1.4){return dist({x:camera.position.x,z:camera.position.z},p)<r}
function use(){if(!active||dead)return;if(hidden){hidden=false;camera.position.y=1.62;$('notice').textContent='숨은 곳에서 나왔다.';sfx('drawer');return}let list=[...doors.filter(d=>!d.opened).map(d=>({type:'drawer',v:d})),...hides.map(h=>({type:'hide',v:h})),{type:'exit',v:exitObj}].filter(o=>near(o.v.pos)).sort((a,b)=>dist(a.v.pos,{x:camera.position.x,z:camera.position.z})-dist(b.v.pos,{x:camera.position.x,z:camera.position.z}));let n=list[0];if(!n){$('notice').textContent='가까이 상호작용할 것이 없어.';return}if(n.type==='drawer'){n.v.opened=true;n.v.obj.visible=false;sfx('drawer');if(n.v.key){gotKey=true;sfx('key');$('notice').textContent='열쇠를 찾았다!'}else $('notice').textContent='서랍 안은 비어 있다.';hud()}else if(n.type==='hide'){hidden=true;hideObj=n.v;camera.position.set(n.v.pos.x,1.2,n.v.pos.z);$('notice').textContent='숨었다. 괴물이 지나가길 기다려.';sfx('drawer')}else if(gotKey&&found.every(Boolean)){end(true)}else $('notice').textContent='열쇠와 비밀번호 숫자 4개를 찾아야 해.'}
function hud(){$('objective').textContent=`열쇠 ${gotKey?1:0}/1 · 비밀번호 ${found.filter(Boolean).length}/4`}
function end(win){active=false;dead=true;clearInterval(timer);$('end').style.display='flex';$('endTitle').textContent=win?'탈출 성공!':'잡혔다!';$('endMsg').textContent=win?'미로에서 탈출했다.':'다시 도전해 봐.'}
function pathStep(from,to){let sx=Math.floor(from.x),sy=Math.floor(from.z),tx=Math.floor(to.x),ty=Math.floor(to.z),q=[[sx,sy]],prev=new Map([[sx+','+sy,null]]),end=null;while(q.length){let [x,y]=q.shift();if(x===tx&&y===ty){end=[x,y];break}for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let X=x+dx,Y=y+dy,k=X+','+Y;if(X<1||Y<1||X>=N-1||Y>=N-1||maze[Y][X]||prev.has(k))continue;prev.set(k,[x,y]);q.push([X,Y])}}if(!end)return null;let cur=end;while(prev.get(cur.join(','))&&!(prev.get(cur.join(','))[0]===sx&&prev.get(cur.join(','))[1]===sy))cur=prev.get(cur.join(','));return{x:cur[0]+.5,z:cur[1]+.5}}
function start(){sound();clearInterval(timer);$('menu').style.display='none';$('lobby').style.display='none';$('game').style.display='block';document.body.classList.add('playing');$('scare').style.display=$('end').style.display='none';active=true;dead=false;hidden=false;gotKey=false;found=[false,false,false,false];flashOn=true;keys={};joy={x:0,y:0};$('notice').textContent='안전 구역에서 출발한다.';build();music(true);requestAnimationFrame(loop)}
function update(dt){if(!active)return;let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,l=Math.hypot(f,s);if(l>1){f/=l;s/=l}let speed=2.7*dt,dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*speed,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;if(!hidden){if(!blocked(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(!blocked(camera.position.x,camera.position.z+dz))camera.position.z+=dz}if(keys.ArrowLeft)yaw+=dt*1.8;if(keys.ArrowRight)yaw-=dt*1.8;camera.rotation.y=yaw;flash.intensity=flashOn?60:0;for(let d of digits)if(!d.found&&near(d.pos,.65)){d.found=true;found[digits.indexOf(d)]=true;d.obj.visible=false;sfx('key');$('notice').textContent='벽에서 비밀번호 숫자를 찾았다!';hud()}if(!hidden){let p={x:monster.position.x,z:monster.position.z},t={x:camera.position.x,z:camera.position.z},n=pathStep(p,t);if(n){let dx=n.x-p.x,dz=n.z-p.z,l=Math.hypot(dx,dz),v=(dist(p,t)<7?1.25:.72)*dt;if(l>.03){monster.position.x+=dx/l*v;monster.position.z+=dz/l*v}}monster.lookAt(camera.position.x,1,camera.position.z);if(dist({x:monster.position.x,z:monster.position.z},{x:camera.position.x,z:camera.position.z})<.65){active=false;dead=true;sfx('scare');$('scare').style.display='flex'}}let nearThing=[...doors.filter(d=>!d.opened).map(d=>({p:d.pos,t:'E / 클릭: 서랍 열기'})),...hides.map(h=>({p:h.pos,t:'F / 클릭: 숨기'})),{p:exitObj.pos,t:'E / 클릭: 탈출구'}].sort((a,b)=>dist(a.p,{x:camera.position.x,z:camera.position.z})-dist(b.p,{x:camera.position.x,z:camera.position.z}))[0];$('hint').style.display=nearThing&&near(nearThing.p,1.5)?'block':'none';if(nearThing)$('hint').textContent=hidden?'E / 클릭: 나오기':nearThing.t}
function loop(){if(!active)return;update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera);requestAnimationFrame(loop)}
$('question').onclick=()=>{sound();$('menu').style.display='none';$('lobby').style.display='flex';$('title').style.color='#f33';$('title').textContent='16년생 홍우주의 분노';$('tag').textContent='';sfx('scare');music(true)};$('single').onclick=()=>{mode='single';start()};$('multi').onclick=()=>{$('multiPanel').style.display='block'};$('create').onclick=()=>{roomCode=String(100000+(Math.random()*900000|0));$('roomMsg').textContent='방 번호: '+roomCode+' (실제 온라인 연결은 서버 필요)';mode='multi';start()};$('join').onclick=()=>{roomCode=$('room').value.trim();if(!/^\d{6}$/.test(roomCode)){$('roomMsg').textContent='6자리 번호를 입력해.';return}mode='multi';start()};$('back').onclick=()=>{clearInterval(timer);$('lobby').style.display='none';$('menu').style.display='flex';$('title').textContent='16년생 홍우주의 기쁨';$('title').style.color='#ffe34d';music(false)};$('exit').onclick=()=>{active=false;document.body.classList.remove('playing');$('game').style.display='none';$('lobby').style.display='flex';music(true)};$('use').onclick=use;$('flash').onclick=()=>{flashOn=!flashOn};$('view').addEventListener('click',use);$('retry').onclick=start;$('again').onclick=start;$('toMenu').onclick=()=>{active=false;document.body.classList.remove('playing');$('end').style.display='none';$('menu').style.display='flex';$('title').textContent='16년생 홍우주의 기쁨';$('title').style.color='#ffe34d';music(false)};
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')use();if(e.code==='KeyF'){if(hidden){hidden=false;camera.position.y=1.62}else{let h=hides.find(h=>near(h.pos));if(h){hidden=true;hideObj=h;camera.position.set(h.pos.x,1.2,h.pos.z)}}}if(e.code==='KeyQ')flashOn=!flashOn});window.addEventListener('keyup',e=>keys[e.code]=false);
let stick=$('stick');stick.addEventListener('pointerdown',e=>{joyId=e.pointerId;stick.setPointerCapture(e.pointerId);joyUpdate(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyUpdate(e)});function joyUpdate(e){let r=stick.getBoundingClientRect();joy.x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.4)));joy.y=-Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height*.4)))}function joyReset(){joy={x:0,y:0};joyId=null}['pointerup','pointercancel','lostpointercapture'].forEach(e=>stick.addEventListener(e,joyReset));
let drag=false,last=0;$('view').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){drag=true;last=e.clientX}});$('view').addEventListener('pointermove',e=>{if(drag&&e.buttons===1){yaw-=(e.clientX-last)*.004;last=e.clientX}});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('resize',()=>{if(renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});music(false);
</script></body></html>
